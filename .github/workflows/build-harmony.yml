name: Build HarmonyOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'androidApp/**'
      - 'iosApp/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'androidApp/**'
      - 'iosApp/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-harmony-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: HarmonyOS HAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check if Harmony project exists
        id: preflight
        run: |
          HARMONY_DIR="harmonyApp"
          if [ ! -d "$HARMONY_DIR" ]; then
            echo "harmony_dir_present=false" >> $GITHUB_OUTPUT
            echo "::warning::harmonyApp directory not found — skipping Harmony build."
            exit 0
          fi

          HVIGORW="$HARMONY_DIR/hvigorw"
          if [ -f "$HVIGORW" ]; then
            echo "hvigorw_present=true" >> $GITHUB_OUTPUT
          else
            echo "hvigorw_present=false" >> $GITHUB_OUTPUT
            echo "::warning::hvigorw not found in harmonyApp — skipping Harmony build."
            exit 0
          fi

          if [ -f "$HARMONY_DIR/package.json" ]; then
            echo "package_json_present=true" >> $GITHUB_OUTPUT
          else
            echo "package_json_present=false" >> $GITHUB_OUTPUT
          fi

          echo "harmony_dir_present=true" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            kernel/deepseek-harness/pnpm-lock.yaml
            tools/harness-transpiler/pnpm-lock.yaml

      # ════════════════════════════════════════════════════════════
      # QuickJS 兼容性门禁：重建 harness.js 并静态检测缺失 API。
      # 内核/手改导致 QuickJS 运行时缺失 → 构建明确失败（红），
      # 报告见 artifact（quickjs-compat-report-*，含 AI 修复指引）。
      # ════════════════════════════════════════════════════════════

      - name: QuickJS compatibility gate (rebuild + check)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        run: |
          pnpm --dir kernel/deepseek-harness install --frozen-lockfile
          pnpm --dir tools/harness-transpiler install --frozen-lockfile
          pnpm --dir tools/harness-transpiler run build
          pnpm --dir tools/harness-transpiler run patch
          node tools/harness-transpiler/check-quickjs-compat.mjs \
            --kernel-commit "$(git -C kernel/deepseek-harness rev-parse HEAD)"
          # 门禁通过后将再生成的内核部署到 rawfile（CI 不依赖本地产物）
          cp tools/harness-transpiler/output/harness.js \
            harmonyApp/entry/src/main/resources/rawfile/harness.js

      - name: Upload QuickJS compat report (always)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-compat-report-${{ github.sha }}
          path: |
            tools/harness-transpiler/output/quickjs-compat-report.json
            tools/harness-transpiler/output/harness.bundle.js
          retention-days: 7
          if-no-files-found: ignore

      - name: Setup JDK 17 (KMP shared module)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle (KMP)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make wrappers executable
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        run: |
          chmod +x gradlew 2>/dev/null || true
          chmod +x harmonyApp/hvigorw 2>/dev/null || true

      - name: Install Harmony dependencies
        if: |
          steps.preflight.outputs.harmony_dir_present == 'true' &&
          steps.preflight.outputs.hvigorw_present == 'true' &&
          steps.preflight.outputs.package_json_present == 'true'
        working-directory: harmonyApp
        run: npm ci || npm install

      - name: Install DevEco CLI (hvigor)
        if: |
          steps.preflight.outputs.harmony_dir_present == 'true' &&
          steps.preflight.outputs.hvigorw_present == 'true' &&
          steps.preflight.outputs.package_json_present != 'true'
        run: |
          npm install -g @ohos/hvigor-ohos-plugin

      - name: Assemble Shared (JVM + Android targets for Harmony interop)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        run: ./gradlew :shared:compileKotlinAndroid --no-daemon || true

      # HAP 打包依赖 DevEco 工具链：@ohos/hvigor 未发布到任何公共 npm registry
      # （项目 devDeps 是本地 file: 路径），OHOS SDK 亦无公开镜像 —— ubuntu runner
      # 上无法真正出包。此步骤尽力而为：成功则上传 artifact，失败不阻塞门禁。
      # 硬性质量检查是上方的 QuickJS 兼容门禁（kernel 重建 + API 静态检测）。
      - name: Build HarmonyOS HAP (best-effort)
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        continue-on-error: true
        working-directory: harmonyApp
        run: |
          ./hvigorw --mode module \
            -p module=entry@default \
            assembleHap \
            --no-daemon \
            --stacktrace

      - name: Upload HAP artifact
        if: steps.preflight.outputs.harmony_dir_present == 'true' && steps.preflight.outputs.hvigorw_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: harmony-hap-${{ github.sha }}
          path: harmonyApp/**/build/default/outputs/default/*.hap
          retention-days: 7
          if-no-files-found: warn
