# HarnessApp iOS — xcodegen 工程
#
# 纯 Swift 本地引擎（JavaScriptCore + harness.js），无 KMP 依赖。
# 构建：
#   cd iosApp && xcodegen generate
#   open Harnest.xcodeproj，Cmd+R

name: Harnest
options:
  bundleIdPrefix: com.harnest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Harnest:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Harnest
        CFBundleIdentifier: com.harnest
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 用于拍照并让 AI 分析画面内容
        NSPhotoLibraryUsageDescription: 用于选择照片并交给 AI 分析
        NSPhotoLibraryAddUsageDescription: 用于将生成结果保存到相册
        NSMicrophoneUsageDescription: 用于录音转写与语音相关能力
        NSContactsUsageDescription: 用于按指令查询/新建联系人
        NSCalendarsUsageDescription: 用于按指令查询/新建日历事件
        NSCalendarsFullAccessUsageDescription: 用于按指令查询/新建日历事件
        NSCalendarsWriteOnlyAccessUsageDescription: 用于按指令新建日历事件
        NSLocationWhenInUseUsageDescription: 用于按指令获取当前位置
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harnest
        PRODUCT_NAME: Harnest
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  HarnestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HarnestTests
    dependencies:
      - target: Harnest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harnest.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harnest:
    build:
      targets:
        Harnest: all
        HarnestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarnestTests
